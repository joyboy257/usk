<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">USK — Universal Skills Library</title>
  <desc id="desc">A dark Rust-inspired banner showing one universal skill package converted into native Claude Code and Codex harness formats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.55" stop-color="#121827"/>
      <stop offset="1" stop-color="#21150f"/>
    </linearGradient>
    <radialGradient id="orange" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="17" stdDeviation="19" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="500" rx="28" fill="url(#grid)"/>
  <ellipse cx="1050" cy="240" rx="300" ry="280" fill="url(#orange)" filter="url(#blur)"/>
  <ellipse cx="740" cy="180" rx="240" ry="220" fill="url(#blue)" filter="url(#blur)"/>
  <rect x="1" y="1" width="1278" height="498" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(72 60)">
    <rect width="60" height="60" rx="17" fill="#f97316"/>
    <path d="M18 19h24v7H25v8h15v7H25v7h-7z" fill="#fff7ed"/>
    <text x="84" y="41" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="750" letter-spacing="5">USK</text>
    <text x="178" y="41" fill="#fdba74" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="620" letter-spacing="1">UNIVERSAL SKILLS LIBRARY</text>
  </g>

  <g transform="translate(72 174)">
    <text fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="680" letter-spacing="-2.2">
      <tspan x="0" y="0">Author once.</tspan>
      <tspan x="0" y="63">Install into any harness.</tspan>
    </text>
    <text x="0" y="146" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">A Rust schema, CLI, adapter system, and optional registry for</text>
    <text x="0" y="177" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">portable AI-agent skills across Claude Code, Codex, and beyond.</text>

    <g transform="translate(0 216)">
      <rect width="142" height="42" rx="21" fill="#f97316" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.38"/>
      <circle cx="21" cy="21" r="4" fill="#fb923c"/>
      <text x="36" y="27" fill="#ffedd5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="620">Local-first</text>
      <rect x="156" width="164" height="42" rx="21" fill="#60a5fa" fill-opacity="0.11" stroke="#93c5fd" stroke-opacity="0.30"/>
      <circle cx="177" cy="21" r="4" fill="#93c5fd"/>
      <text x="192" y="27" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="620">Harness adapters</text>
      <rect x="334" width="178" height="42" rx="21" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="355" cy="21" r="4" fill="#4ade80"/>
      <text x="370" y="27" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="620">Validated packages</text>
    </g>
  </g>

  <g transform="translate(742 84)" filter="url(#shadow)">
    <rect width="458" height="334" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity="0.10"/>

    <g transform="translate(24 24)">
      <rect width="160" height="118" rx="15" fill="#0b0d12" stroke="#f97316" stroke-opacity="0.36"/>
      <text x="16" y="26" fill="#fb923c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">UNIVERSAL SKILL</text>
      <rect x="16" y="42" width="128" height="25" rx="6" fill="#1f2937"/>
      <text x="25" y="59" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">skill.yaml</text>
      <rect x="16" y="76" width="128" height="25" rx="6" fill="#1f2937"/>
      <text x="25" y="93" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SKILL.md</text>

      <path d="M172 59h44" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
      <path d="M209 53l8 6-8 6" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="228" width="182" height="118" rx="15" fill="#111827" stroke="#60a5fa" stroke-opacity="0.34"/>
      <text x="244" y="26" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">USK CORE</text>
      <text x="244" y="51" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Parse · validate · resolve</text>
      <text x="244" y="75" fill="#9ca3af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">schema · semver · index</text>
      <text x="244" y="96" fill="#9ca3af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">lockfile · package store</text>

      <path d="M319 130v35" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
      <path d="M313 158l6 8 6-8" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect y="178" width="194" height="104" rx="15" fill="#111827" stroke="#d8b4fe" stroke-opacity="0.34"/>
      <text x="16" y="204" fill="#d8b4fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">CLAUDE CODE</text>
      <text x="16" y="230" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">~/.claude/skills/</text>
      <text x="16" y="253" fill="#9ca3af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">native SKILL.md directory</text>

      <rect x="216" y="178" width="194" height="104" rx="15" fill="#111827" stroke="#4ade80" stroke-opacity="0.34"/>
      <text x="232" y="204" fill="#4ade80" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">CODEX CLI</text>
      <text x="232" y="230" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">agent.yaml</text>
      <text x="232" y="253" fill="#9ca3af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">harness-native conversion</text>

      <path d="M319 166c-54 0-86 5-116 25" fill="none" stroke="#d8b4fe" stroke-width="2"/>
      <path d="M319 166c54 0 86 5 116 25" fill="none" stroke="#4ade80" stroke-width="2"/>
    </g>
  </g>
</svg>
