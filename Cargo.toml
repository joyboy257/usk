[workspace]
resolver = "2"
members = [
    "crates/usk-core",
    "crates/usk-harness-core",
    "crates/usk-harness-claude",
    "crates/usk-harness-codex",
    "crates/usk-cli",
    "crates/usk-server",
    "crates/usk-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Harness-agnostic registry for reusable AI agent skills"
readme = "README.md"
keywords = ["ai", "agents", "skills", "registry", "harness"]
categories = ["development-tools", "api-bindings"]

# `repository`, `homepage`, and `documentation` are intentionally omitted so
# this workspace can be forked under any GitHub owner without changes. Add
# them locally before publishing to crates.io (see `cargo package --list`).

[workspace.dependencies.serial_test]
version = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
semver = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
git2 = "0.19"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
once_cell = "1"
flate2 = "1"
tar = "0.4"
pulldown-cmark = "0.12"
maud = "0.27"

[workspace.dependencies.tempfile]
version = "3"
